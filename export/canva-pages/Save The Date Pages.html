<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>Save The Date — Yaz & Yosef</title>

<meta name="ext-resource-dependency" content="../src/assets/watercolor-landscape.jpeg" data-resource-id="watercolor">
<meta name="ext-resource-dependency" content="../src/assets/hands-ring-new.jpeg" data-resource-id="ringNew">
<meta name="ext-resource-dependency" content="../src/assets/holdinghands-new.jpeg" data-resource-id="handsNew">
<meta name="ext-resource-dependency" content="../src/assets/mountainview.jpeg" data-resource-id="mountainview">

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
    <rect width="400" height="400" fill="#EFE6D4"/>
    <g transform="translate(120, 140)">
      <path d="M0,120 L40,40 L80,90 L120,20 L160,120 Z" fill="#8A9574" opacity="0.7"/>
      <path d="M40,120 L80,60 L120,100 L160,50 L160,120 Z" fill="#6E8060" opacity="0.85"/>
    </g>
    <text x="200" y="300" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#3a4a3a">Save the Date</text>
  </svg>
</template>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #1a1512; }
  body {
    font-family: "Inter", sans-serif;
    color: #2B2418;
  }

  /* Each page is a fixed 1080×1920 portrait card. Stacked vertically — Canva
     splits on page elements when importing multi-page HTML. */
  .page {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
    page-break-after: always;
    break-after: page;
    margin: 0 auto;
  }

  .photo {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
  }

  /* ─── Page 1: Landing watercolor ─── */
  .p1 .photo { background-position: center 35%; }
  .p1 .top-wash {
    position: absolute; top: 0; left: 0; right: 0; height: 32%;
    background: linear-gradient(180deg, rgba(255,250,238,0.85) 0%, rgba(255,250,238,0.45) 50%, rgba(255,250,238,0) 100%);
  }
  .p1 .title {
    position: absolute; top: 180px; left: 0; right: 0;
    text-align: center; padding: 0 80px;
  }
  .p1 .title-text {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-weight: 400;
    font-size: 64px;
    line-height: 1.2;
    color: #3a4a3a;
    letter-spacing: 0.8px;
    text-shadow: 0 2px 4px rgba(255,250,238,0.6);
  }
  .p1 .title-rule {
    margin: 50px auto 0;
    width: 80px; height: 1.2px;
    background: rgba(58,74,58,0.4);
  }
  .p1 .pill-wrap {
    position: absolute; bottom: 150px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 36px;
  }
  .p1 .pill {
    background: rgba(255,250,238,0.88);
    border: 1px solid rgba(58,74,58,0.18);
    padding: 30px 56px;
    border-radius: 999px;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: 40px;
    color: #3a4a3a;
    letter-spacing: 0.8px;
    box-shadow: 0 16px 50px rgba(40,60,40,0.18);
  }
  .p1 .arrow {
    width: 96px; height: 96px;
    border-radius: 50%;
    background: rgba(255,250,238,0.85);
    border: 1px solid rgba(58,74,58,0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    color: #3a4a3a;
    box-shadow: 0 10px 30px rgba(40,60,40,0.15);
  }

  /* ─── Page 2: Ring photo / Save the Date ─── */
  .p2 .photo { background-position: center 30%; }
  .p2 .vignette {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.05) 30%, rgba(0,0,0,0.1) 60%, rgba(0,0,0,0.55) 100%);
  }
  .p2 .ornament {
    position: absolute; top: 110px; left: 0; right: 0; text-align: center;
    font-family: "Inter", sans-serif;
    font-size: 24px; letter-spacing: 12px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 2px 16px rgba(0,0,0,0.7);
  }
  .p2 .ornament .amp { opacity: 0.7; margin: 0 8px; }
  .p2 .center {
    position: absolute; left: 0; right: 0; top: 50%;
    transform: translateY(-50%);
    text-align: center; padding: 0 60px;
  }
  .p2 .save-date {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-weight: 400;
    font-size: 220px;
    line-height: 1;
    color: #fff;
    letter-spacing: -3px;
    text-shadow: 0 8px 60px rgba(0,0,0,0.45), 0 4px 20px rgba(0,0,0,0.3);
  }
  .p2 .the {
    font-style: normal;
    font-size: 44px;
    letter-spacing: 14px;
    margin: 14px 0;
    text-transform: uppercase;
    opacity: 0.85;
  }
  .p2 .rule {
    margin: 64px auto 0;
    width: 140px; height: 1.2px;
    background: rgba(255,255,255,0.7);
  }
  .p2 .date {
    margin-top: 56px;
    font-family: "Cormorant Garamond", serif;
    font-weight: 400;
    font-size: 80px;
    color: #fff;
    letter-spacing: 1.2px;
    text-shadow: 0 4px 28px rgba(0,0,0,0.5);
  }
  .p2 .date sup { font-size: 44px; vertical-align: super; }

  /* ─── Page 3: Names + location ─── */
  .p3 .vignette {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.15) 45%, rgba(0,0,0,0.55) 100%);
  }
  .p3 .names {
    position: absolute; left: 0; right: 0; top: 130px;
    text-align: center; padding: 0 60px;
  }
  .p3 .name {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-weight: 400;
    font-size: 200px;
    line-height: 0.95;
    color: #fff;
    letter-spacing: -4px;
    text-shadow: 0 8px 56px rgba(0,0,0,0.55);
  }
  .p3 .amp-big {
    font-family: "Cormorant Garamond", serif;
    font-size: 80px;
    color: rgba(255,255,255,0.85);
    margin: 6px 0;
    text-shadow: 0 4px 28px rgba(0,0,0,0.5);
  }
  .p3 .tagline {
    margin: 56px auto 0;
    display: flex; align-items: center; justify-content: center; gap: 28px;
  }
  .p3 .tagline .line { width: 60px; height: 1.2px; background: rgba(255,255,255,0.6); }
  .p3 .tagline .lbl {
    font-family: "Inter", sans-serif;
    font-size: 24px; letter-spacing: 10px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  .p3 .location {
    position: absolute; bottom: 150px; left: 0; right: 0;
    text-align: center; padding: 0 60px;
  }
  .p3 .city {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: 64px;
    color: #fff;
    letter-spacing: 1px;
    text-shadow: 0 4px 28px rgba(0,0,0,0.55);
  }
  .p3 .country {
    margin-top: 14px;
    font-family: "Inter", sans-serif;
    font-size: 24px; letter-spacing: 10px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }

  /* ─── Page 4: Countdown ─── */
  .p4 .vignette {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,14,18,0.55) 0%, rgba(10,14,18,0.25) 50%, rgba(10,14,18,0.75) 100%);
  }
  .p4 .top {
    position: absolute; top: 110px; left: 0; right: 0; text-align: center;
    font-family: "Inter", sans-serif;
    font-size: 24px; letter-spacing: 12px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 2px 16px rgba(0,0,0,0.7);
  }
  .p4 .center {
    position: absolute; left: 0; right: 0; top: 50%;
    transform: translateY(-50%);
    padding: 0 50px;
  }
  .p4 .until {
    text-align: center; margin-bottom: 100px;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: 76px;
    color: #fff;
    line-height: 1.2;
    text-shadow: 0 4px 36px rgba(0,0,0,0.55);
  }
  .p4 .ido {
    font-style: normal; letter-spacing: 6px; font-size: 60px;
    display: block; margin-top: 12px;
  }
  .p4 .countdown {
    display: flex; gap: 8px; margin: 0 auto; max-width: 880px;
    align-items: center;
  }
  .p4 .unit { text-align: center; flex: 1; }
  .p4 .unit .num {
    font-family: "Cormorant Garamond", serif;
    font-weight: 400;
    font-size: 130px;
    line-height: 1;
    color: #fff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 4px 40px rgba(0,0,0,0.5);
  }
  .p4 .unit .lbl {
    font-family: "Inter", sans-serif;
    font-size: 22px; letter-spacing: 7px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
    margin-top: 22px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  .p4 .countdown .sep {
    width: 1px; background: rgba(255,255,255,0.4);
    align-self: stretch; margin: 14px 0;
  }
  .p4 .signature {
    position: absolute; bottom: 110px; left: 0; right: 0; text-align: center;
  }
  .p4 .signature .yy {
    font-family: "Cormorant Garamond", serif;
    font-size: 60px;
    color: #fff;
    letter-spacing: 6px;
    text-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }
  .p4 .signature .yy .a { font-style: italic; opacity: 0.7; margin: 0 10px; }
  .p4 .signature .formal {
    margin-top: 22px;
    font-family: "Inter", sans-serif;
    font-size: 22px; letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>

<!-- Page 1: Landing -->
<div class="page p1">
  <div class="photo" id="photo-1"></div>
  <div class="top-wash"></div>
  <div class="title">
    <div class="title-text">A letter from<br>the mountains</div>
    <div class="title-rule"></div>
  </div>
  <div class="pill-wrap">
    <div class="pill">Tap anywhere to continue the story</div>
    <div class="arrow">↓</div>
  </div>
</div>

<!-- Page 2: Save The Date / Ring -->
<div class="page p2">
  <div class="photo" id="photo-2"></div>
  <div class="vignette"></div>
  <div class="ornament">— Yaz <span class="amp">&amp;</span> Yosef —</div>
  <div class="center">
    <div class="save-date">
      Save
      <div class="the">the</div>
      Date
    </div>
    <div class="rule"></div>
    <div class="date">March 13<sup>th</sup>, 2027</div>
  </div>
</div>

<!-- Page 3: Names + Location -->
<div class="page p3">
  <div class="photo" id="photo-3"></div>
  <div class="vignette"></div>
  <div class="names">
    <div class="name">Yaz</div>
    <div class="amp-big">&amp;</div>
    <div class="name">Yosef</div>
    <div class="tagline">
      <div class="line"></div>
      <div class="lbl">are getting married</div>
      <div class="line"></div>
    </div>
  </div>
  <div class="location">
    <div class="city">Jiutepec, Morelos</div>
    <div class="country">México</div>
  </div>
</div>

<!-- Page 4: Countdown -->
<div class="page p4">
  <div class="photo" id="photo-4"></div>
  <div class="vignette"></div>
  <div class="top">— counting the days —</div>
  <div class="center">
    <div class="until">
      Until we say
      <span class="ido">I DO</span>
    </div>
    <div class="countdown" id="countdown">
      <!-- filled by JS at static-snapshot time -->
    </div>
  </div>
  <div class="signature">
    <div class="yy">Y <span class="a">&amp;</span> Y</div>
    <div class="formal">formal invitation to follow</div>
  </div>
</div>

<script>
  // Apply bundled photo URLs
  document.getElementById('photo-1').style.backgroundImage = 'url(' + window.__resources.watercolor + ')';
  document.getElementById('photo-2').style.backgroundImage = 'url(' + window.__resources.ringNew + ')';
  document.getElementById('photo-3').style.backgroundImage = 'url(' + window.__resources.handsNew + ')';
  document.getElementById('photo-4').style.backgroundImage = 'url(' + window.__resources.mountainview + ')';

  // Static countdown snapshot — computed once on load (Canva imports as static)
  const target = new Date('2027-03-13T17:00:00-06:00');
  const now = new Date();
  const diff = Math.max(0, target - now);
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const minutes = Math.floor((diff % 3600000) / 60000);
  const seconds = Math.floor((diff % 60000) / 1000);

  const units = [
    [days, 'days'],
    [hours, 'hrs'],
    [minutes, 'min'],
    [seconds, 'sec'],
  ];
  const cd = document.getElementById('countdown');
  units.forEach(([n, lbl], i) => {
    if (i > 0) {
      const sep = document.createElement('div');
      sep.className = 'sep';
      cd.appendChild(sep);
    }
    const u = document.createElement('div');
    u.className = 'unit';
    u.innerHTML = '<div class="num">' + String(n).padStart(2, '0') + '</div><div class="lbl">' + lbl + '</div>';
    cd.appendChild(u);
  });
</script>

</body>
</html>

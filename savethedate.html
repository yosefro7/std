<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #1a1512;
    color: #2B2418;
    overscroll-behavior: none;
  }

  /* stage — centers the phone on desktop, full-bleed on small screens */
  .stage {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background:
      radial-gradient(ellipse at 50% 0%, #2a2018 0%, #15100c 60%, #0a0705 100%);
  }

  @media (max-width: 480px) {
    .stage { padding: 0; }
    .phone-wrap { border-radius: 0 !important; box-shadow: none !important; }
  }

  /* save the date scrollable content */
  .phone-scroll {
    width: 100%; height: 100%;
    overflow-y: auto; overflow-x: hidden;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .phone-scroll::-webkit-scrollbar { display: none; }

  /* paper/cream background */
  .cream-bg {
    background:
      radial-gradient(ellipse at 30% 20%, #F9F1E2 0%, transparent 55%),
      radial-gradient(ellipse at 80% 85%, #F0E5D0 0%, transparent 50%),
      linear-gradient(180deg, #F6EDDC 0%, #EDE1C9 100%);
    position: relative;
  }
  .cream-bg::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(circle at 15% 30%, rgba(139,108,66,0.04), transparent 40%),
      radial-gradient(circle at 85% 70%, rgba(139,108,66,0.05), transparent 45%);
    mix-blend-mode: multiply;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); opacity: 0.65; }
    50% { transform: translateY(-4px); opacity: 1; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.9; }
  }
  @keyframes floatIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  /* Landing screen — gentle pan/zoom on the watercolor */
  @keyframes landingFade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes landingDrift {
    from { transform: scale(1.04) translateY(0); }
    to   { transform: scale(1.10) translateY(-6px); }
  }
  /* Reveal — watercolor zooms in & dissolves outward, then ring photo shows through */
  @keyframes revealZoom {
    0%   { transform: scale(1.05); filter: blur(0); opacity: 1; }
    60%  { transform: scale(1.45); filter: blur(2px); opacity: 0.8; }
    100% { transform: scale(1.9);  filter: blur(8px); opacity: 0; }
  }
  @keyframes revealIris {
    0%   { opacity: 0; }
    50%  { opacity: 0.6; }
    100% { opacity: 0; }
  }
  @keyframes revealOverlay {
    0%, 70% { opacity: 1; }
    100%    { opacity: 0; }
  }
  @keyframes textBlurIn {
    from { opacity: 0; filter: blur(14px); transform: translateY(8px); }
    to   { opacity: 1; filter: blur(0); transform: translateY(0); }
  }
  .stdt-text-in > * {
    animation: textBlurIn 1.1s cubic-bezier(.2,.7,.2,1) both;
    animation-delay: 0.6s;
  }
  .stdt-photo-in {
    animation: floatIn 0.9s ease-out both;
  }

  /* envelope open → photo simply fades in at final size (no scaling) */
  @keyframes photoPullOut {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes envSink {
    from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    to   { opacity: 0; transform: translate(-50%, -48%) scale(0.92); }
  }
  @keyframes fadeInGlow {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* Tweaks panel */
  .tweaks-panel {
    position: fixed; bottom: 16px; right: 16px;
    background: rgba(26, 21, 18, 0.92);
    backdrop-filter: blur(16px);
    color: #F6EDDC;
    border: 1px solid rgba(246,237,220,0.12);
    border-radius: 14px;
    padding: 14px 16px;
    font-family: 'Inter', sans-serif; font-size: 11px;
    min-width: 220px;
    z-index: 1000;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .tweaks-panel h3 {
    margin: 0 0 12px; font-size: 10px; letter-spacing: 3px;
    text-transform: uppercase; color: rgba(246,237,220,0.6); font-weight: 500;
  }
  .tweaks-panel label { display: block; margin-bottom: 10px; }
  .tweaks-panel .lbl {
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(246,237,220,0.5); margin-bottom: 5px;
  }
  .tweaks-panel .opts {
    display: flex; gap: 4px; flex-wrap: wrap;
  }
  .tweaks-panel .opt {
    padding: 5px 9px; border-radius: 6px; cursor: pointer;
    background: rgba(246,237,220,0.08);
    border: 1px solid rgba(246,237,220,0.08);
    color: rgba(246,237,220,0.8);

}

function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',

      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>

}

function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>

  );
  return (

            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>

        )}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>

    </div>
  );
}

function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';

      {icon && <div style={{ width: 30, height: 30, borderRadius: 7, background: icon, marginRight: 12, flexShrink: 0 }} />}
      <div style={{ flex: 1, color: text }}>{title}</div>

      {!isLast && <div style={{ position: 'absolute', bottom: 0, right: 0, left: icon ? 58 : 16, height: 0.5, background: sep }} />}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && <div style={{ fontFamily: '-apple-system, system-ui', fontSize: 13, color: hc, textTransform: 'uppercase', padding: '8px 36px 6px', letterSpacing: -0.08 }}>{header}</div>}
      <div style={{ background: bg, borderRadius: 26, margin: '0 16px', overflow: 'hidden' }}>{children}</div>
    </div>
  );
}

function IOSDevice({ children, width = 402, height = 874, dark = false, title, keyboard = false }) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',

        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
      </div>
    </div>

}

Object.assign(window, { IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow });

<script type="text/babel">
function Countdown({ target }) {
  const [now, setNow] = React.useState(new Date());
  React.useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  const diff = Math.max(0, target - now);
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const minutes = Math.floor((diff % 3600000) / 60000);
  const seconds = Math.floor((diff % 60000) / 1000);
  const unit = (n, label) => (
    <div style={{ textAlign: 'center', flex: 1, minWidth: 0 }}>
      <div style={{ fontFamily: '"Cormorant Garamond", serif', fontWeight: 400, fontSize: 46, lineHeight: 1, color: '#fff', fontVariantNumeric: 'tabular-nums', textShadow: '0 2px 20px rgba(0,0,0,0.5)' }}>{String(n).padStart(2, '0')}</div>
      <div style={{ fontFamily: '"Inter", sans-serif', fontSize: 9, letterSpacing: 2.5, textTransform: 'uppercase', color: 'rgba(255,255,255,0.75)', marginTop: 8, textShadow: '0 1px 6px rgba(0,0,0,0.6)' }}>{label}</div>
    </div>
  );
  return <div style={{ display: 'flex', gap: 4, margin: '0 auto', maxWidth: 340 }}>{unit(days, 'days')}{unit(hours, 'hrs')}{unit(minutes, 'min')}{unit(seconds, 'sec')}</div>;
}

      <div className={justOpened ? 'stdt-photo-in' : ''} style={{ position: 'absolute', inset: 0, backgroundImage: 'url(assets/hands-ring-new.jpeg)', backgroundSize: 'cover', backgroundPosition: 'center 30%' }}/>
      <div className={justOpened ? 'stdt-photo-in' : ''} style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.05) 30%, rgba(0,0,0,0.1) 60%, rgba(0,0,0,0.55) 100%)' }}/>
      <div className={justOpened ? 'stdt-text-in' : ''} style={{ position: 'absolute', inset: 0 }}>
        <div style={{ position: 'absolute', top: 48, left: 0, right: 0, textAlign: 'center', fontFamily: '"Inter", sans-serif', fontSize: 10, letterSpacing: 5, textTransform: 'uppercase', color: 'rgba(255,255,255,0.9)' }}>— Yaz <span style={{ opacity: 0.7, margin: '0 3px' }}>&amp;</span> Yosef —</div>
        <div style={{ position: 'absolute', left: 0, right: 0, top: '50%', transform: 'translateY(-50%)', textAlign: 'center', padding: '0 24px' }}>
          <div style={{ fontFamily: '"Cormorant Garamond", serif', fontStyle: 'italic', fontWeight: 400, fontSize: 68, lineHeight: 1, color: '#fff', letterSpacing: -1 }}>Save<div style={{ fontStyle: 'normal', fontSize: 18, letterSpacing: 6, margin: '6px 0', textTransform: 'uppercase', opacity: 0.85 }}>the</div>Date</div>
          <div style={{ marginTop: 26, fontFamily: '"Cormorant Garamond", serif', fontWeight: 400, fontSize: 28, color: '#fff', letterSpacing: 0.5 }}>March 13<span style={{ fontSize: 16, verticalAlign: 'super' }}>th</span>, 2027</div>
        </div>
      </div>
    </section>
  );
}

        <div style={{ fontFamily: '"Cormorant Garamond", serif', fontStyle: 'italic', fontWeight: 400, fontSize: 64, lineHeight: 0.95, color: '#fff', letterSpacing: -1.5 }}>Yaz</div>
        <div style={{ fontFamily: '"Cormorant Garamond", serif', fontSize: 28, color: 'rgba(255,255,255,0.85)', margin: '2px 0' }}>&amp;</div>
        <div style={{ fontFamily: '"Cormorant Garamond", serif', fontStyle: 'italic', fontWeight: 400, fontSize: 64, lineHeight: 0.95, color: '#fff', letterSpacing: -1.5 }}>Yosef</div>

function CountdownSection({ phoneH, target }) {
  return (
    <section style={{ height: phoneH, width: '100%', position: 'relative', overflow: 'hidden' }}>
      <div style={{ position: 'absolute', inset: 0, backgroundImage: 'url(assets/mountainview.jpeg)', backgroundSize: 'cover', backgroundPosition: 'center' }}/>
      <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, rgba(10,14,18,0.55) 0%, rgba(10,14,18,0.25) 50%, rgba(10,14,18,0.75) 100%)' }}/>
      <div style={{ position: 'absolute', left: 0, right: 0, top: '50%', transform: 'translateY(-50%)', padding: '0 20px' }}>
        <div style={{ textAlign: 'center', marginBottom: 40, fontFamily: '"Cormorant Garamond", serif', fontStyle: 'italic', fontSize: 30, color: '#fff', lineHeight: 1.2 }}>Until we say<br/><span style={{ fontStyle: 'normal', letterSpacing: 2, fontSize: 24 }}>I DO</span></div>
        <Countdown target={target}/>
      </div>
    </section>
  );
}

window.RingSection = RingSection;
window.NamesSection = NamesSection;
window.CountdownSection = CountdownSection;
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

function SaveTheDate() {
  // ─── Tweakable state ───
  const [tone, setTone] = useState(window.TWEAK_DEFAULTS.envelopeTone);
  const [motionStyle, setMotionStyle] = useState(window.TWEAK_DEFAULTS.motionStyle);
  const [nameTreatment, setNameTreatment] = useState(window.TWEAK_DEFAULTS.nameTreatment);

  // ─── envelope open state ───
  const [opened, setOpened] = useState(false);
  const [showDetails, setShowDetails] = useState(false);
  const scrollerRef = useRef(null);

  useEffect(() => {
    if (opened) setShowDetails(true);
  }, [opened]);

  // ─── Edit-mode wiring ───
  const [editOn, setEditOn] = useState(false);
  useEffect(() => {
    const handler = (e) => {
      if (!e.data) return;
      if (e.data.type === '__activate_edit_mode') setEditOn(true);
      if (e.data.type === '__deactivate_edit_mode') setEditOn(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const persist = (key, val) => {
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  };
  const update = (setter, key) => (val) => {
    setter(val); persist(key, val);
  };

  const resetEnvelope = () => {
    setOpened(false);
    setShowDetails(false);
    if (scrollerRef.current) scrollerRef.current.scrollTop = 0;
  };

  // ─── Phone-sized container. Responsive: full viewport on narrow screens ───
  const isMobile = typeof window !== 'undefined' && window.innerWidth < 480;
  const phoneW = isMobile ? window.innerWidth : 390;
  const phoneH = isMobile ? window.innerHeight : 844;

  const t = window.ENVELOPE_TONES[tone];

  return (
    <>
      <div className="stage">
        <div className="phone-wrap" style={{
          width: phoneW, height: phoneH,
          borderRadius: isMobile ? 0 : 44,
          overflow: 'hidden', position: 'relative',
          boxShadow: isMobile ? 'none' : '0 40px 80px rgba(0,0,0,0.4), 0 0 0 10px #1a1512, 0 0 0 11px rgba(246,237,220,0.08)',
          background: '#F6EDDC',
        }}>
          <div ref={scrollerRef} className="phone-scroll cream-bg">

            {/* ───────── Landing screen — watercolor mountains, tap to enter ───────── */}
            {!opened && (
              <section
                onClick={() => setOpened(true)}
                style={{
                  height: phoneH, width: '100%',
                  position: 'relative', overflow: 'hidden',
                  cursor: 'pointer',
                  animation: 'landingFade 1.4s ease-out both',
                }}
              >
                {/* watercolor landscape */}
                <div style={{
                  position: 'absolute', inset: 0,
                  backgroundImage: 'url(assets/watercolor-landscape.jpeg)',
                  backgroundSize: 'cover', backgroundPosition: 'center 35%',
                  animation: 'landingDrift 14s ease-in-out infinite alternate',
                }}/>

                {/* soft cream wash at top for legibility */}
                <div style={{
                  position: 'absolute', top: 0, left: 0, right: 0, height: '32%',
                  background: 'linear-gradient(180deg, rgba(255,250,238,0.85) 0%, rgba(255,250,238,0.45) 50%, rgba(255,250,238,0) 100%)',
                  pointerEvents: 'none',
                }}/>

                {/* title */}
                <div style={{
                  position: 'absolute', top: 76, left: 0, right: 0,
                  textAlign: 'center', padding: '0 32px',
                }}>
                  <div style={{
                    fontFamily: '"Cormorant Garamond", serif', fontStyle: 'italic',
                    fontWeight: 400, fontSize: 26, lineHeight: 1.2,
                    color: '#3a4a3a', letterSpacing: 0.3,
                    textShadow: '0 1px 2px rgba(255,250,238,0.6)',
                  }}>
                    A letter from the mountains
                  </div>
                  <div style={{
                    margin: '20px auto 0', width: 32, height: 0.5,
                    background: 'rgba(58,74,58,0.4)',
                  }}/>
                </div>

                {/* tap hint at bottom — pill with backdrop for legibility */}
                <div style={{
                  position: 'absolute', bottom: 56, left: 0, right: 0,
                  display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14,
                }}>
                  <div style={{
                    background: 'rgba(255,250,238,0.88)',
                    backdropFilter: 'blur(6px)',
                    WebkitBackdropFilter: 'blur(6px)',
                    border: '1px solid rgba(58,74,58,0.18)',
                    padding: '12px 22px', borderRadius: 999,
                    fontFamily: '"Cormorant Garamond", serif', fontStyle: 'italic',
                    fontSize: 16, color: '#3a4a3a', letterSpacing: 0.3,
                    boxShadow: '0 6px 20px rgba(40,60,40,0.18)',
                  }}>
                    Tap anywhere to continue the story
                  </div>
                  <div style={{
                    animation: 'pulse 2.4s ease-in-out infinite',
                    width: 38, height: 38, borderRadius: '50%',
                    background: 'rgba(255,250,238,0.85)',
                    border: '1px solid rgba(58,74,58,0.35)',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontSize: 14, color: '#3a4a3a',
                    boxShadow: '0 4px 12px rgba(40,60,40,0.15)',
                  }}>
                    ↓
                  </div>
                </div>
              </section>
            )}

            {/* ───────── Reveal animation overlay (plays once on tap) ───────── */}
            {opened && (
              <div style={{
                position: 'absolute', inset: 0, zIndex: 20,
                pointerEvents: 'none',
                animation: 'revealOverlay 1.4s ease-out both',
              }}>
                <div style={{
                  position: 'absolute', inset: 0,
                  backgroundImage: 'url(assets/watercolor-landscape.jpeg)',
                  backgroundSize: 'cover', backgroundPosition: 'center 35%',
                  animation: 'revealZoom 1.4s cubic-bezier(.5,.0,.3,1) both',
                  WebkitMaskImage: 'radial-gradient(ellipse at center, #000 0%, #000 100%)',
                  maskImage: 'radial-gradient(ellipse at center, #000 0%, #000 100%)',
                }}/>
                {/* iris-out wash that paints away the watercolor */}
                <div style={{
                  position: 'absolute', inset: 0,
                  animation: 'revealIris 1.4s ease-out both',
                  background: 'radial-gradient(circle at center, rgba(255,250,238,0) 0%, rgba(255,250,238,0) 30%, rgba(255,250,238,0.95) 100%)',
                }}/>
              </div>
            )}

            {/* ───────── After open: 3 full-bleed photo sections (photo fades, text blurs in) ───────── */}
            {showDetails && (
              <div>
                <RingSection phoneH={phoneH} justOpened/>
                <NamesSection phoneH={phoneH}/>
                <CountdownSection phoneH={phoneH} target={window.WEDDING.date}/>
              </div>
            )}
          </div>
        </div>
      </div>

      {/* Tweaks panel */}
      {editOn && (
        <div className="tweaks-panel">
          <h3>Tweaks</h3>

          <div className="lbl">Envelope tone</div>
          <div className="opts" style={{ marginBottom: 12 }}>
            {Object.keys(window.ENVELOPE_TONES).map(k => {
              const active = k === tone;
              return (
                <div key={k}
                  className={'opt' + (active ? ' active' : '')}
                  onClick={() => update(setTone, 'envelopeTone')(k)}>
                  <span className="swatch" style={{ background: window.ENVELOPE_TONES[k].paper }}/>
                  {k}
                </div>
              );
            })}
          </div>

          <div className="lbl">Photo reveal</div>
          <div className="opts" style={{ marginBottom: 12 }}>
            {['tumble', 'fan'].map(k => (
              <div key={k}
                className={'opt' + (k === motionStyle ? ' active' : '')}
                onClick={() => update(setMotionStyle, 'motionStyle')(k)}>
                {k}
              </div>
            ))}
          </div>

          <div className="lbl">Names</div>
          <div className="opts" style={{ marginBottom: 4 }}>
            {[['serif', 'stacked italic'], ['caps', 'horizontal caps']].map(([k, label]) => (
              <div key={k}
                className={'opt' + (k === nameTreatment ? ' active' : '')}
                onClick={() => update(setNameTreatment, 'nameTreatment')(k)}>
                {label}
              </div>
            ))}
          </div>

          <button className="reset-btn" onClick={resetEnvelope}>
            Reset envelope ↺
          </button>
        </div>
      )}

    </>
  );
}

function BgMusic() {
  const ref = React.useRef(null);
  const [needsTap, setNeedsTap] = React.useState(false);
  const [muted, setMuted] = React.useState(false);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    el.volume = 0.55;
    const tryPlay = () => {
      const p = el.play();
      if (p && p.catch) p.catch(() => setNeedsTap(true));
    };
    tryPlay();
    const onFirstTap = () => { tryPlay(); setNeedsTap(false); window.removeEventListener('pointerdown', onFirstTap); };
    window.addEventListener('pointerdown', onFirstTap, { once: true });
    return () => window.removeEventListener('pointerdown', onFirstTap);
  }, []);
  const toggle = () => {
    const el = ref.current; if (!el) return;
    if (el.paused) { el.play(); setMuted(false); }
    else { el.pause(); setMuted(true); }
  };
  return (
    <>
      <audio ref={ref} src="assets/marry-you-piano.mp3" loop preload="auto" />
      <button onClick={toggle} aria-label={muted ? 'Unmute' : 'Mute'} style={{
        position: 'fixed', top: 14, right: 14, zIndex: 2000,
        width: 40, height: 40, borderRadius: '50%',
        background: 'rgba(255,250,238,0.85)',
        border: '1px solid rgba(58,74,58,0.25)',
        backdropFilter: 'blur(6px)', WebkitBackdropFilter: 'blur(6px)',
        color: '#3a4a3a', fontSize: 16, cursor: 'pointer',
        boxShadow: '0 4px 14px rgba(0,0,0,0.18)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      }}>
        {muted ? '♪̸' : '♪'}
      </button>
      {needsTap && !muted && (
        <div style={{
          position: 'fixed', top: 14, right: 64, zIndex: 2000,
          padding: '8px 14px', borderRadius: 999,
          background: 'rgba(255,250,238,0.92)',
          border: '1px solid rgba(58,74,58,0.2)',
          fontFamily: '"Cormorant Garamond", serif', fontStyle: 'italic',
          color: '#3a4a3a', fontSize: 13,
          boxShadow: '0 4px 14px rgba(0,0,0,0.15)',
        }}>tap to play music</div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <>
    <BgMusic/>
    <SaveTheDate/>
  </>
);
</script>

</body>
</html>
